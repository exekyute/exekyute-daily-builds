# Golden set: 15 freight-document extraction cases.
# Every expected value is derivable from the document text alone. No outside
# knowledge of carriers, ports, or shipments is required to answer any case.
# Loaded by both promptfooconfig files as `tests: file://golden/golden-set.yaml`.
# `branch` names the failure mode the case exists to exercise and is not used in
# the prompt. `expected` is read by harness/grader.py at eval time.

- description: "BOL-001 clean baseline"
  vars:
    case_id: BOL-001
    branch: clean-baseline
    document: |
      OCEAN BILL OF LADING
      B/L NO: MRDU-2026-004411
      SHIPMENT REF: SHP-88213
      CARRIER: MERIDIAN LINES        SCAC: MRDU
      CONTAINER: MRDU4419078
      PORT OF LOADING: CNSHA SHANGHAI
      GROSS WEIGHT: 18,420.00 KG
      INCOTERM: FOB
      ON BOARD DATE: 2026-02-11
      DECLARED VALUE: USD 42,300.00
      NO DANGEROUS GOODS DECLARED
    expected:
      shipment_id: SHP-88213
      carrier_scac: MRDU
      container_id: MRDU4419078
      gross_weight_kg: 18420.0
      incoterm: FOB
      port_of_loading: CNSHA
      ship_date: "2026-02-11"
      declared_value_usd: 42300.00
      hazmat: false

